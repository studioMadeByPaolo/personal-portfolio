<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Pagina non trovata | Made by Paolo</title>
<meta name="description" content="La pagina che stai cercando non esiste o è stata spostata.">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#110D0A">
<meta name="color-scheme" content="dark">
<link rel="canonical" href="https://www.madebypaolo.it/404.html">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #110D0A;
  --bg2: #17120E;
  --text: #F2E9DE;
  --text-soft: #CFC3B5;
  --text-muted: #A89A8C;
  --accent: #E07A45;
  --on-accent: #1A0F09;
  --line: rgba(242,233,222,.12);
  --font-display: 'Cormorant Garamond', Georgia, serif;
  --font-body: 'DM Sans', system-ui, sans-serif;
  --pad: clamp(16px, 5vw, 72px);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--bg); }
body { background: var(--bg); color: var(--text); font-family: var(--font-body); line-height: 1.7; -webkit-font-smoothing: antialiased; }
em { font-style: italic; color: var(--accent); }
.nav { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 68px; padding: 0 var(--pad); background: rgba(17,13,10,.72); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-bottom: 1px solid rgba(242,233,222,.07); }
.nav-logo { white-space: nowrap; font-family: var(--font-display); font-size: 26px; line-height: 1; color: var(--text); text-decoration: none; }
.nav-right { display: flex; align-items: center; gap: 14px; }
.nav-back { font-size: 14px; color: #B9AC9E; text-decoration: none; transition: color .2s; }
.nav-back:hover { color: var(--text); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
@media (max-width: 520px) {
  .nav-logo { font-size: 22px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
main { flex: 1; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 64px var(--pad); }
body { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; }
.glow { position: absolute; inset: 0; background: radial-gradient(50% 45% at 50% 45%, rgba(224,122,69,.16), rgba(224,122,69,0) 70%); pointer-events: none; }
.code { position: relative; font-family: var(--font-display); font-weight: 300; font-size: clamp(120px, 26vw, 240px); line-height: .9; letter-spacing: -.04em; color: var(--text); margin-bottom: 12px; }
h1 { position: relative; font-family: var(--font-display); font-weight: 400; font-size: clamp(32px, 4.4vw, 48px); line-height: 1.05; margin-bottom: 16px; }
p { position: relative; max-width: 440px; color: var(--text-soft); margin-bottom: 36px; }
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 26px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-weight: 600; text-decoration: none; transition: transform .2s ease, background-color .2s ease; }
.btn:hover { transform: translateY(-1px); background: #E98A57; }
</style>
</head>
<body>
<nav class="nav">
  <a href="/" class="nav-logo">Made by <em>Paolo</em></a>
  <a href="/" class="nav-back" data-i18n="back">← Torna alla home</a>
</nav>
<main>
  <div class="glow" aria-hidden="true"></div>
  <div class="code" aria-hidden="true">4<em>0</em>4</div>
  <h1 data-i18n="title">Pagina non trovata</h1>
  <p data-i18n="body">La pagina che stai cercando non esiste o è stata spostata. Prova a tornare alla home.</p>
  <a href="/" class="btn" data-i18n="cta">← Torna alla home</a>
</main>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var stored; try { stored = localStorage.getItem('lang'); } catch (e) {}
  var urlLang = params.get('lang');
  var lang = ['it','en'].includes(urlLang) ? urlLang
           : ['it','en'].includes(stored) ? stored
           : (navigator.language && navigator.language.toLowerCase().startsWith('en')) ? 'en' : 'it';
  var COPY = {
    it: { title: 'Pagina non trovata',
          body: 'La pagina che stai cercando non esiste o è stata spostata. Prova a tornare alla home.',
          cta: '← Torna alla home', back: '← Torna alla home',
          docTitle: '404 — Pagina non trovata | Made by Paolo' },
    en: { title: 'Page not found',
          body: "The page you're looking for doesn't exist or has been moved. Head back to the home page.",
          cta: '← Back to home', back: '← Back to home',
          docTitle: '404 — Page not found | Made by Paolo' }
  };
  document.documentElement.lang = lang;
  document.title = COPY[lang].docTitle;
  document.querySelectorAll('[data-i18n]').forEach(function (el) {
    var v = COPY[lang][el.dataset.i18n];
    if (v) el.textContent = v;
  });
})();
</script>
</body>
</html>
